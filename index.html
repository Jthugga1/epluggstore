<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E Plugg — Electric Scooters, E-Bikes &amp; Electronics Superstore</title>
  <meta name="description" content="E Plugg is the U.S. online superstore for electric scooters, e-bikes, folding and commuter e-bikes, mobility accessories, electronics and gadgets. Free shipping over $150 across the contiguous US.">
  <meta property="og:title" content="E Plugg — Electric Mobility &amp; Electronics Superstore">
  <meta property="og:description" content="Performance scooters, e-bikes, parts and electronics. Shipping across the contiguous United States.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#07090E">
  <meta name='impact-site-verification' value='aad8e7c2-b22e-4483-a290-fbe37bf92e0d'>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="ticker" aria-label="Store announcements"><div class="ticker-track" id="ticker"></div></div>

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="brand" aria-label="E Plugg home"><span class="brand-mark"></span><span class="brand-word"><b>E</b>PLUGG</span></a>
    <nav class="desk-nav" id="deskNav"></nav>
    <div class="topbar-right">
      <a href="#/account" class="icon-btn" aria-label="Account">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </a>
      <a href="#/cart" class="cart-pill" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="M9 12a3 3 0 0 0 6 0"/></svg>
        <span id="cartCount">0</span>
      </a>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>

  <main id="app"></main>

  <footer class="footer" id="footer"></footer>

  <nav class="bottom-nav" id="bottomNav">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>HOME</span></a>
    <a href="#/shop" data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>SHOP</span></a>
    <a href="#/cart" data-tab="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>CART</span></a>
    <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>ACCOUNT</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Hidden form so Netlify Forms detects the newsletter + contact forms at deploy time -->
  <form name="newsletter" netlify netlify-honeypot="bot-field" hidden><input name="email"><input name="bot-field"></form>
  <form name="contact" netlify netlify-honeypot="bot-field" hidden><input name="name"><input name="email"><input name="order"><textarea name="message"></textarea><input name="bot-field"></form>

  <script src="assets/app.js"></script>
</body>
</html>
