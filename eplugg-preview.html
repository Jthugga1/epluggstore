<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="E Plugg — Electric Mobility &amp; Electronics Superstore">
  <meta property="og:description" content="Performance scooters, e-bikes, parts and electronics. Shipping across the contiguous United States.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#07090E">
  <meta name='impact-site-verification' value='aad8e7c2-b22e-4483-a290-fbe37bf92e0d'>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMEY1NjYiLz48cGF0aCBkPSJNMzcgOCAxNSAzNmgxNGwtNCAyMCAyNC0zMEgzNHoiIGZpbGw9IiMwNzA5MEUiIHRyYW5zZm9ybT0icm90YXRlKC0xMCAzMiAzMikiLz48L3N2Zz4K">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>:root {
  --bg: #07090E;
  --bg-2: #0C1018;
  --card: #10151F;
  --line: #1B2230;
  --line-green: #0E3D22;
  --green: #00F566;
  --green-2: #00C853;
  --green-dim: rgba(0, 245, 102, 0.12);
  --text: #F2F5F8;
  --muted: #8A97AB;
  --danger: #FF5A5F;
  --radius: 26px;
  --font: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --maxw: 1200px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 76px;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }

/* Ticker */
.ticker { background: var(--green); color: #04150A; overflow: hidden; white-space: nowrap; height: 34px; display: flex; align-items: center; }
.ticker-track { display: inline-flex; gap: 40px; padding-left: 16px; font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .18em; animation: ticker 32s linear infinite; }
.ticker-track span { display: inline-flex; gap: 40px; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }

/* Header */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: rgba(10, 13, 19, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-green); }
.icon-btn { background: none; border: 0; padding: 6px; display: inline-flex; color: var(--text); cursor: pointer; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMEY1NjYiLz48cGF0aCBkPSJNMzcgOCAxNSAzNmgxNGwtNCAyMCAyNC0zMEgzNHoiIGZpbGw9IiMwNzA5MEUiIHRyYW5zZm9ybT0icm90YXRlKC0xMCAzMiAzMikiLz48L3N2Zz4K") center/cover; box-shadow: 0 0 22px rgba(0, 245, 102, .35); flex: none; }
.brand-word { font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--green); }
.brand-word b { color: var(--text); font-weight: 700; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.cart-pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line-green); background: rgba(0, 245, 102, .06); color: var(--green); font-family: var(--mono); font-weight: 700; }
.desk-nav { display: none; gap: 22px; margin-left: 24px; font-size: 15px; color: var(--muted); }
.desk-nav a:hover { color: var(--text); }

/* Drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); background: var(--bg-2); border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .25s; z-index: 41; padding: 20px; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer h4 { margin: 24px 0 10px; }
.drawer a { display: block; padding: 10px 0; color: var(--muted); font-size: 17px; }
.drawer a:hover { color: var(--text); }

/* Type helpers */
.eyebrow { font-family: var(--mono); font-size: 13px; letter-spacing: .28em; text-transform: uppercase; color: var(--green); margin: 0 0 4px; font-weight: 500; }
h1, h2, h3 { letter-spacing: -.02em; margin: 0; line-height: 1.1; }
h2 { font-size: clamp(28px, 6vw, 40px); font-weight: 700; }
.muted { color: var(--muted); }
.green { color: var(--green); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; padding: 15px 26px; font-weight: 700; font-size: 18px; border: 1px solid transparent; cursor: pointer; transition: transform .1s, box-shadow .2s; }
.btn:active { transform: scale(.98); }
.btn-green { background: var(--green); color: #04150A; box-shadow: 0 0 30px rgba(0, 245, 102, .25); }
.btn-ghost { background: rgba(255, 255, 255, .04); border-color: #2A3344; color: var(--text); font-weight: 500; }
.btn-dark { background: #060807; color: var(--green); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* Sections */
.section { padding: 40px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.view-all { color: var(--text); opacity: .85; display: inline-flex; gap: 8px; align-items: center; font-size: 17px; white-space: nowrap; }

/* Hero */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(3px) brightness(.35) saturate(.6); transform: scale(1.06); }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 9, 14, .3), var(--bg)); }
.hero-inner { position: relative; padding: 48px 16px 40px; }
.hero-logo { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
.hero-logo .brand-mark { width: 84px; height: 84px; border-radius: 20px; }
.hero-logo .brand-word { font-size: clamp(56px, 14vw, 88px); }
.pill-tag { display: inline-flex; align-items: center; gap: 12px; padding: 8px 20px; border: 1px solid var(--green-2); border-radius: 999px; font-family: var(--mono); color: var(--green); letter-spacing: .24em; font-size: 14px; }
.pill-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); }
.hero h1 { font-size: clamp(40px, 10vw, 72px); font-weight: 700; margin: 28px 0 18px; max-width: 12ch; }
.hero p.lead { color: #B8C2D2; font-size: 19px; max-width: 46ch; margin: 0 0 28px; }
.hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 26px 40px; margin-top: 40px; font-family: var(--mono); }
.hero-stats b { font-size: 30px; }
.hero-stats span { color: var(--muted); letter-spacing: .1em; margin-left: 8px; }

/* Trust bar */
.trust { background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 28px 0; }
.trust-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 20px; }
.trust-item { display: flex; gap: 14px; align-items: flex-start; }
.trust-icon { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--green-dim); color: var(--green); display: grid; place-items: center; }
.trust-item b { display: block; font-size: 18px; font-weight: 600; }
.trust-item small { color: var(--muted); font-size: 15px; }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cat-card { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1 / 1; background: var(--card); }
.cat-card.wide { grid-column: span 2; aspect-ratio: 2.05 / 1; }
.cat-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.cat-card:hover img { transform: scale(1.04); }
.cat-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(7, 9, 14, .92)); }
.cat-card .cat-label { position: absolute; left: 20px; right: 20px; bottom: 18px; z-index: 1; }
.cat-card .count { font-family: var(--mono); color: var(--green); letter-spacing: .2em; font-size: 12px; }
.cat-card h3 { font-size: clamp(20px, 5vw, 30px); font-weight: 700; }
.cat-card.wide h3 { font-size: clamp(26px, 6vw, 38px); }

/* Empty state */
.empty { border: 1.5px dashed var(--line-green); border-radius: var(--radius); padding: 44px 24px; text-align: center; }
.empty h3 { font-weight: 400; font-size: 24px; margin-bottom: 10px; }
.empty p { color: var(--muted); margin: 0 auto; max-width: 40ch; font-size: 17px; }

/* Product cards */
.prod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.prod-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; }
.prod-card .thumb { position: relative; aspect-ratio: 1 / 1; background: #0A0E15; }
.prod-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 10px; left: 10px; background: var(--green); color: #04150A; font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .08em; padding: 4px 8px; border-radius: 8px; }
.prod-card .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.prod-card .brand-line { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.prod-card .name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.price { font-family: var(--mono); font-weight: 700; color: var(--green); }
.price s { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: .85em; }
.prod-card .price { margin-top: auto; padding-top: 6px; }

/* Deals block */
.deals { border: 1px solid var(--line-green); border-radius: var(--radius); padding: 28px 22px; background:
  linear-gradient(rgba(0, 245, 102, .03) 1px, transparent 1px) 0 0/36px 36px,
  linear-gradient(90deg, rgba(0, 245, 102, .03) 1px, transparent 1px) 0 0/36px 36px,
  linear-gradient(160deg, #0B1712, #090C11 60%); }
.deals h2 { margin: 6px 0 20px; }
.countdown { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
.countdown .box { min-width: 56px; padding: 10px 12px; border: 1px solid var(--line-green); border-radius: 12px; background: rgba(0, 245, 102, .06); color: var(--green); font-family: var(--mono); font-size: 28px; font-weight: 700; text-align: center; }
.countdown .sep { color: var(--muted); font-size: 22px; }
.countdown a { margin-left: 14px; font-size: 18px; }

/* Promo banners */
.banner { position: relative; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line); min-height: 420px; display: flex; align-items: flex-end; }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7, 9, 14, .85), rgba(7, 9, 14, .2)); }
.banner-body { position: relative; z-index: 1; padding: 32px 28px; }
.banner h2 { font-size: clamp(34px, 8vw, 54px); margin: 8px 0 24px; max-width: 14ch; }
.promo { position: relative; overflow: hidden; background: var(--green); color: #04150A; border-radius: var(--radius); padding: 36px 28px; }
.promo .eyebrow { color: #04150A; font-weight: 700; }
.promo h2 { font-size: clamp(38px, 9vw, 60px); margin: 14px 0 28px; max-width: 13ch; }
.promo-bolt { position: absolute; right: -30px; top: -20px; width: 260px; opacity: .14; }
.promo-row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; position: relative; }
.code-chip { border: 2px dashed #04150A; border-radius: 16px; padding: 14px 24px; font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: .04em; background: none; color: inherit; cursor: pointer; }

/* Footer */
.footer { background: var(--bg-2); border-top: 1px solid var(--line); margin-top: 40px; padding: 48px 0 0; }
.footer .brand-mark { width: 64px; height: 64px; border-radius: 16px; }
.footer .brand-word { font-size: 46px; }
.footer .tagline { color: #B8C2D2; font-size: 18px; margin: 18px 0 24px; max-width: 40ch; }
.news { display: flex; gap: 14px; max-width: 520px; }
.news input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 14px 22px; font-size: 18px; }
.news button { border-radius: 16px; padding: 12px 30px; }
.socials { display: flex; gap: 14px; margin: 26px 0 8px; }
.socials a { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 14px; display: grid; place-items: center; color: var(--muted); }
.socials a:hover { color: var(--text); border-color: #2A3344; }
.foot-cols { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 30px; }
.foot-col h4 { font-family: var(--mono); color: var(--green); letter-spacing: .28em; font-size: 14px; font-weight: 500; margin: 24px 0 14px; }
.foot-col a { display: block; color: #B8C2D2; font-size: 18px; padding: 6px 0; }
.foot-col a:hover { color: var(--text); }
.contact-lines { margin: 30px 0 40px; display: grid; gap: 12px; color: var(--muted); font-size: 16px; }
.contact-lines div { display: flex; gap: 12px; align-items: center; }
.legal { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 15px; }
.pay-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.pay-badges span { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--muted); }
.pay-badges span.stripe { border-color: var(--green-2); color: var(--green); }

/* Bottom nav */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(10, 13, 19, .97); border-top: 1px solid var(--line-green); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.bottom-nav svg { width: 26px; height: 26px; }
.bottom-nav a.active { color: var(--green); }

/* Shop page */
.page-head { padding: 32px 0 8px; }
.page-head h1 { font-size: clamp(32px, 7vw, 48px); }
.filters { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; color: var(--muted); background: none; cursor: pointer; font-size: 15px; }
.chip.on { border-color: var(--green-2); color: var(--green); background: var(--green-dim); }
.toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.field { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
.toolbar .field.search { flex: 1 1 200px; }

/* Product page */
.pdp { display: grid; gap: 24px; padding: 24px 0; }
.gallery-main { aspect-ratio: 1 / 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #0A0E15; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.thumbs { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; }
.thumbs button { width: 72px; height: 72px; flex: none; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); padding: 0; background: none; cursor: pointer; }
.thumbs button.on { border-color: var(--green); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.pdp h1 { font-size: clamp(28px, 6vw, 40px); margin: 6px 0 12px; }
.pdp .price { font-size: 28px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.qty button { background: none; border: 0; width: 44px; height: 48px; font-size: 20px; cursor: pointer; }
.qty span { min-width: 36px; text-align: center; font-family: var(--mono); }
.specs { width: 100%; border-collapse: collapse; margin-top: 10px; }
.specs td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.specs td:first-child { color: var(--muted); width: 45%; }
.crumbs { font-size: 14px; color: var(--muted); padding-top: 18px; }
.crumbs a:hover { color: var(--text); }

/* Cart */
.cart-line { display: grid; grid-template-columns: 84px 1fr auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.cart-line img { width: 84px; height: 84px; object-fit: cover; border-radius: 14px; background: #0A0E15; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px; }
.summary { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 10px; }
.summary .row { display: flex; justify-content: space-between; }
.summary .total { font-size: 22px; font-weight: 700; border-top: 1px solid var(--line); padding-top: 12px; }
.promo-input { display: flex; gap: 8px; }
.promo-input .field { flex: 1; min-width: 0; text-transform: uppercase; }

/* Prose pages */
.prose { max-width: 760px; padding: 24px 0 20px; }
.prose h1 { font-size: clamp(32px, 7vw, 46px); margin: 8px 0 20px; }
.prose h2 { font-size: 22px; margin: 28px 0 8px; }
.prose p, .prose li { color: #C3CCDA; font-size: 17px; }
.prose a { color: var(--green); text-decoration: underline; }
.faq details { border-bottom: 1px solid var(--line); padding: 16px 0; }
.faq summary { cursor: pointer; font-weight: 600; font-size: 18px; }
.faq details p { margin: 10px 0 0; }
.form-grid { display: grid; gap: 12px; max-width: 560px; }
.form-grid label { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
.notice { border: 1px solid var(--line-green); background: var(--green-dim); border-radius: 16px; padding: 14px 16px; color: #CFF8DD; font-size: 15px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 20px); background: #121A14; border: 1px solid var(--green-2); color: var(--text); padding: 12px 20px; border-radius: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 50; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 760px) {
  .prod-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .trust-grid { grid-template-columns: repeat(4, 1fr); }
  .foot-cols { grid-template-columns: repeat(3, 1fr); }
  .pdp { grid-template-columns: 1.1fr 1fr; gap: 40px; }
  .cart-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
  .hero-inner { padding: 80px 16px 60px; }
}
@media (min-width: 1000px) {
  body { padding-bottom: 0; }
  .bottom-nav { display: none; }
  .desk-nav { display: flex; }
  .prod-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cat-grid { grid-template-columns: repeat(4, 1fr); }
  .cat-card.wide { aspect-ratio: auto; }
}
</style>
</head>
<body>
  <div class="ticker" aria-label="Store announcements"><div class="ticker-track" id="ticker"></div></div>

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="brand" aria-label="E Plugg home"><span class="brand-mark"></span><span class="brand-word"><b>E</b>PLUGG</span></a>
    <nav class="desk-nav" id="deskNav"></nav>
    <div class="topbar-right">
      <a href="#/account" class="icon-btn" aria-label="Account">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>

  <script>/* E Plugg storefront — no framework, no build step.

    hiboy: "https://www.hiboy.com/",
  },
};

/* Builds a product-level affiliate link from a brand tracking link (Impact, Awin, AvantLink, or a plain URL). */
function affiliateLink(base, productUrl) {
  if (!base) return "";
  try {
    const u = new URL(base);
    if (/awin1\.com$/.test(u.hostname)) u.searchParams.set("ued", productUrl);
    else if (/avantlink\.com$/.test(u.hostname)) u.searchParams.set("url", productUrl);
    else if (/(sjv\.io|pxf\.io|pntrs\.com|pntra\.com|pntrac\.com|evyy\.net|ojrq\.net|7eer\.net|r2ld\.net|ftjcfx\.com|impact|\.io$)/.test(u.hostname)) u.searchParams.set("u", productUrl);
    else return base; // unknown format: use the link exactly as given
    return u.toString();
  } catch { return ""; }
}

const TICKER = [

/* ---------- utils ---------- */
const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const store = {

};
function toast(msg) {

const ICON = {

};

/* ---------- cart ---------- */
const cart = {
  items() { return store.get("eplugg_cart", []); },
  save(items) { store.set("eplugg_cart", items); updateCartCount(); },
  add(id, qty = 1) {
    const items = this.items(); const line = items.find(i => i.id === id);
    if (line) line.qty += qty; else items.push({ id, qty });
    this.save(items);
  },
  setQty(id, qty) { this.save(this.items().map(i => i.id === id ? { ...i, qty } : i).filter(i => i.qty > 0)); },
  clear() { this.save([]); },
  lines() {
    return this.items().map(i => ({ ...i, product: state.products.find(p => p.id === i.id) })).filter(l => l.product);
  },
};
function updateCartCount() {
  const n = cart.items().reduce((a, i) => a + i.qty, 0);
  $("#cartCount").textContent = n;
}
function totals(promoCode) {
  const lines = cart.lines();
  const subtotal = lines.reduce((a, l) => a + l.product.price * l.qty, 0);
  const rate = STORE.promoCodes[(promoCode || "").toUpperCase()] || 0;
  const discount = Math.round(subtotal * rate * 100) / 100;
  const after = subtotal - discount;
  const shipping = lines.length === 0 ? 0 : (after >= STORE.freeShippingOver ? 0 : STORE.flatShipping);
  return { lines, subtotal, discount, shipping, total: after + shipping };
}

/* ---------- shared pieces ---------- */
const catBySlug = slug => state.categories.find(c => c.slug === slug);
const countIn = slug => state.products.filter(p => p.category === slug).length;

}

function pageShop(params, fixedCat) {
  const cat = fixedCat || params.get("cat") || "";
  const q = (params.get("q") || "").trim().toLowerCase();
  const sort = params.get("sort") || "featured";
  const dealsOnly = params.get("deals") === "1";
  let list = state.products.filter(p =>
    (!cat || p.category === cat) &&
    (!dealsOnly || p.deal || p.compare_at_price > p.price) &&
    (!q || [p.name, p.brand, p.short].join(" ").toLowerCase().includes(q)));
  const sorters = {
    featured: (a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0),
    new: (a, b) => (b.new ? 1 : 0) - (a.new ? 1 : 0),
    "price-asc": (a, b) => a.price - b.price,
    "price-desc": (a, b) => b.price - a.price,
  };
  list = [...list].sort(sorters[sort] || sorters.featured);
  const c = catBySlug(cat);
  const base = fixedCat ? `#/category/${fixedCat}` : "#/shop";
  const link = (over) => {
    const p = new URLSearchParams(params); Object.entries(over).forEach(([k, v]) => v ? p.set(k, v) : p.delete(k));
    if (fixedCat) p.delete("cat"); const s = p.toString(); return base + (s ? "?" + s : "");
  };
  return `<div class="wrap">
    <div class="page-head"><p class="eyebrow">${dealsOnly ? "Flash deals" : c ? "Category" : "Shop"}</p>
      <h1>${dealsOnly ? "Today’s deals" : c ? esc(c.name) : "All products"}</h1>${c ? `<p class="muted">${esc(c.description)}</p>` : ""}</div>
    <div class="filters">
      <a class="chip ${!cat ? "on" : ""}" href="${fixedCat ? "#/shop" : link({ cat: "" })}">All</a>
      ${state.categories.map(x => `<a class="chip ${x.slug === cat ? "on" : ""}" href="#/category/${x.slug}">${esc(x.name)}</a>`).join("")}
      <a class="chip ${dealsOnly ? "on" : ""}" href="${link({ deals: dealsOnly ? "" : "1" })}">Deals</a>
    </div>
    <form class="toolbar" id="shopForm">
      <input class="field search" name="q" type="search" placeholder="Search products" value="${esc(params.get("q") || "")}">
      <select class="field" name="sort" aria-label="Sort">
        ${[["featured", "Featured"], ["new", "Newest"], ["price-asc", "Price: low to high"], ["price-desc", "Price: high to low"]]
          .map(([v, l]) => `<option value="${v}" ${v === sort ? "selected" : ""}>${l}</option>`).join("")}
      </select>
    </form>
    <p class="muted" style="margin:0 0 14px">${list.length} product${list.length === 1 ? "" : "s"}</p>
    ${productGrid(list)}
  </div>`;
}

    </div>
    ${related.length ? `<section class="section">${sectionHead("You might like", "More like this")}${productGrid(related)}</section>` : ""}
  </div>`;
}

/* ---------- countdown to local midnight ---------- */
function tickCountdown() {
  const h = $("#cdH"); if (!h) return;
  const now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
  let s = Math.max(0, Math.floor((end - now) / 1000));
  const pad = n => String(n).padStart(2, "0");
  h.textContent = pad(Math.floor(s / 3600)); $("#cdM").textContent = pad(Math.floor(s % 3600 / 60)); $("#cdS").textContent = pad(s % 60);
}
setInterval(tickCountdown, 1000);

/* ---------- router ---------- */
function route() {
  toggleDrawer(false);
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, query] = hash.split("?");
  const params = new URLSearchParams(query || "");
  const parts = path.split("/").filter(Boolean);
  let html, tab = "";
  if (!state.loaded) html = `<div class="wrap muted" style="padding:60px 16px">Loading…</div>`;
  else if (!parts.length) { html = pageHome(); tab = "home"; }
  else if (parts[0] === "shop") { html = pageShop(params); tab = "shop"; }
  else if (parts[0] === "category") { html = catBySlug(parts[1]) ? pageShop(params, parts[1]) : pageNotFound(); tab = "shop"; }
  else if (parts[0] === "product") { html = pageProduct(decodeURIComponent(parts[1] || "")); tab = "shop"; }
  else if (parts[0] === "cart") { html = pageCart(); tab = "cart"; }
  else if (parts[0] === "success") html = pageSuccess();
  else if (parts[0] === "account") { html = pageAccount(); tab = "account"; }
  else if (parts[0] === "page") html = pageInfo(parts[1]);
  else html = pageNotFound();
  app.innerHTML = html;
  document.querySelectorAll("#bottomNav a").forEach(a => a.classList.toggle("active", a.dataset.tab === tab));
  tickCountdown();
  if (!hash.includes("?") || parts[0] !== "shop") window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.id === "menuBtn") return toggleDrawer(true);
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(t.dataset.copy); toast("Code copied — apply it in your cart"); } catch { toast("Use code " + t.dataset.copy + " in your cart"); }
    store.set("eplugg_promo", t.dataset.copy); return;
  }
  if (t.dataset.img) { $("#mainImg").src = t.dataset.img; document.querySelectorAll(".thumbs button").forEach(b => b.classList.toggle("on", b === t)); return; }
  if (t.dataset.q) { const el = $("#qty"); el.textContent = Math.max(1, Math.min(10, +el.textContent + +t.dataset.q)); return; }
  if (t.id === "addBtn") { cart.add(t.dataset.id, +$("#qty").textContent); toast("Added to cart"); return; }
  if (t.dataset.line) {
    const line = cart.items().find(i => i.id === t.dataset.line);
    if (line) cart.setQty(line.id, Math.min(10, line.qty + +t.dataset.d)); return route();
  }
  if (t.dataset.remove) { cart.setQty(t.dataset.remove, 0); return route(); }
  if (t.id === "checkoutBtn") return startCheckout(t);
});
$("#drawerBackdrop").addEventListener("click", () => toggleDrawer(false));

document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "promoForm") {
    e.preventDefault(); const code = f.code.value.trim().toUpperCase();
    if (!code) { store.set("eplugg_promo", ""); return route(); }
    if (STORE.promoCodes[code]) { store.set("eplugg_promo", code); toast("Promo applied"); } else toast("That code isn’t valid");
    return route();
  }
  if (f.id === "shopForm") {
    e.preventDefault();
    const [path, query] = location.hash.slice(1).split("?"); const p = new URLSearchParams(query || "");
    f.q.value ? p.set("q", f.q.value) : p.delete("q"); p.set("sort", f.sort.value);
    location.hash = path + "?" + p.toString(); return;
  }
  if (f.id === "newsForm" || f.id === "contactForm") {
    e.preventDefault();
    try {
      const res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(new FormData(f)).toString() });
      if (!res.ok) throw new Error();
      f.reset(); toast(f.id === "newsForm" ? "You’re on the list ⚡" : "Message sent — we’ll be in touch");
    } catch { toast("Couldn’t send right now — please try again"); }
  }
});
document.addEventListener("change", e => { if (e.target.form && e.target.form.id === "shopForm") e.target.form.requestSubmit(); });

async function startCheckout(btn) {
  btn.disabled = true; btn.textContent = "Starting checkout…";
  try {
    const res = await fetch(STORE.checkoutEndpoint, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items: cart.items(), promo: store.get("eplugg_promo", "") }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.url) throw new Error(data.error || "Checkout isn’t available yet.");
    location.href = data.url;
  } catch (err) {
    toast(err.message || "Checkout isn’t available yet."); btn.disabled = false; btn.innerHTML = "Secure checkout " + ICON.arrow;
  }
}
